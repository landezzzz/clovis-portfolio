<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jerry at 50 · Commemorative Magazine</title>
<meta name="description" content="Jerry Pani: 50th Birthday Celebration & 20th Wedding Anniversary. Cape Town, November 2026.">
<meta property="og:title" content="Jerry at 50 · Commemorative Magazine">
<meta property="og:description" content="50th Birthday Celebration & 20th Wedding Anniversary. Cape Town, November 2026.">
<meta property="og:image" content="pages/p00.jpg">
<meta name="theme-color" content="#ffffff">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&display=swap">
<style>
:root{--bg:#e7e4de;--bar-bg:#ffffff;--ink:#1d1a16;--gold:#b8933a;--gold-btn:#d9b65e;--muted:#7a7266;--bar:56px}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:'Cormorant Garamond',Georgia,serif;overflow:hidden}
header{position:fixed;inset:0 0 auto 0;height:var(--bar);display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 20px;background:var(--bar-bg);box-shadow:0 1px 0 rgba(0,0,0,.06);z-index:5}
.brand{font-weight:600;font-size:21px;color:var(--ink);white-space:nowrap}
.brand span{color:var(--gold);font-style:italic;font-weight:500;margin-left:6px}
.right{display:flex;align-items:center;gap:14px}
.count{font-size:17px;color:var(--muted);font-variant-numeric:lining-nums tabular-nums;white-space:nowrap}
.dl{display:inline-flex;align-items:center;gap:6px;color:#1d1a16;background:var(--gold-btn);text-decoration:none;font-weight:600;font-size:16px;padding:8px 14px;border-radius:999px;min-height:40px}
.dl:hover{background:#e7c97a}
.dl svg{width:16px;height:16px}

#stage{position:fixed;inset:var(--bar) 0 0 0;display:flex;align-items:center;justify-content:center}
#holder{position:relative}
.page{background:#fff}
.page img{width:100%;height:100%;display:block;object-fit:cover;user-select:none;-webkit-user-drag:none}
/* thin edge so every page boundary reads clearly, even dark pages */
.page::after{content:"";position:absolute;inset:0;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08);pointer-events:none}
.stf__parent{filter:drop-shadow(0 14px 28px rgba(40,30,15,.22)) drop-shadow(0 2px 4px rgba(40,30,15,.12))}

.nav{position:fixed;top:50%;transform:translateY(-50%);width:50px;height:50px;border-radius:50%;border:none;background:#fff;color:var(--ink);display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:4;box-shadow:0 4px 14px rgba(0,0,0,.12)}
.nav:hover{color:var(--gold)}
.nav:disabled{opacity:.35;cursor:default}
.nav svg{width:22px;height:22px}
#prev{left:16px}#next{right:16px}
.hint{position:fixed;bottom:8px;left:0;right:0;text-align:center;font-size:15px;color:var(--muted);font-style:italic;pointer-events:none}
.loading{position:fixed;inset:var(--bar) 0 0 0;display:flex;align-items:center;justify-content:center;font-size:20px;font-style:italic;color:var(--muted)}
.portrait .nav{width:40px;height:40px;top:auto;bottom:14px;transform:none;opacity:.92}
.portrait #prev{left:14px}.portrait #next{right:14px}
@media (max-width:560px){.brand span{display:none}.dl .t{display:none}.dl{padding:8px 11px}header{padding:0 12px}}

.pick{display:inline-flex;align-items:center;gap:6px;background:#fff;border:1px solid rgba(0,0,0,.14);color:var(--ink);font:600 16px 'Cormorant Garamond',Georgia,serif;padding:7px 13px;border-radius:999px;min-height:40px;cursor:pointer}
.pick:hover{border-color:var(--gold);color:var(--gold)}
.pick svg{width:16px;height:16px}
#picker{position:fixed;inset:0;z-index:20;background:rgba(20,16,10,.45);display:none;align-items:stretch;justify-content:flex-end}
#picker.open{display:flex}
.panel{background:#faf8f4;width:min(560px,100%);height:100%;overflow-y:auto;padding:22px 22px 40px;box-shadow:-10px 0 40px rgba(0,0,0,.2)}
.ph{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.ph h2{margin:0;font-size:30px;font-weight:600}
.close{border:none;background:none;font-size:30px;line-height:1;cursor:pointer;color:var(--ink);padding:4px 8px}
.jump{display:flex;gap:8px;align-items:center;margin:0 0 18px;font-size:18px}
.jump input{width:80px;font:inherit;padding:6px 10px;border:1px solid rgba(0,0,0,.2);border-radius:8px;background:#fff}
.jump button{font:600 16px 'Cormorant Garamond',serif;background:var(--gold-btn);border:none;border-radius:999px;padding:7px 16px;cursor:pointer}
.chap{display:grid;grid-template-columns:1fr 1fr;gap:4px 16px;margin:0 0 22px;padding:0;list-style:none}
.chap button{all:unset;cursor:pointer;display:flex;gap:10px;align-items:baseline;padding:5px 0;font-size:18px;line-height:1.2}
.chap button:hover{color:var(--gold)}
.chap b{color:var(--gold);font-weight:600;min-width:24px;font-variant-numeric:lining-nums}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:14px}
.grid button{all:unset;cursor:pointer;text-align:center;font-size:14px;color:var(--muted)}
.grid img{width:100%;aspect-ratio:794/1123;object-fit:cover;display:block;box-shadow:0 2px 8px rgba(0,0,0,.18);margin-bottom:5px;border:2px solid transparent;box-sizing:border-box}
.grid button:hover img{border-color:var(--gold)}
.grid button.cur img{border-color:var(--gold)}
.grid button.cur{color:var(--ink);font-weight:600}
@media (max-width:560px){.chap{grid-template-columns:1fr}.pick .t{display:none}.pick{padding:8px 11px}.grid{grid-template-columns:repeat(3,1fr)}}

#log{position:fixed;inset:0;z-index:20;background:rgba(20,16,10,.45);display:none;align-items:stretch;justify-content:flex-end}
#log.open{display:flex}
.logday{margin:0 0 20px}
.logday h3{margin:0 0 8px;font-size:20px;font-weight:600;color:var(--gold)}
.logday ul{margin:0;padding:0 0 0 18px;font-size:18px;line-height:1.35}
.logday li{margin:0 0 6px}
.logday button{all:unset;cursor:pointer;color:var(--gold);text-decoration:underline;text-underline-offset:2px}
.lognote{font-size:16px;color:var(--muted);font-style:italic;margin:0 0 18px}
.pick{position:relative}
.dot{position:absolute;top:6px;right:6px;width:8px;height:8px;border-radius:50%;background:#c0392b;display:none}
.dot.on{display:block}
</style>
</head>
<body>
<header>
  <div class="brand">Jerry at 50<span>· 50 years of life, 20 years of love</span></div>
  <div class="right">
    <div class="count" id="count" aria-live="polite"></div>
    <button class="pick" id="openLog" aria-label="See recent updates"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><span class="t">Updates</span><span class="dot" id="logDot"></span></button>
    <button class="pick" id="openPicker" aria-label="Choose a page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg><span class="t">Pages</span></button>
    <a class="dl" href="Jerry_at_50_Magazine.pdf" download aria-label="Download the magazine as a PDF"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12m0 0-5-5m5 5 5-5M4 21h16"/></svg><span class="t">Download PDF</span></a>
  </div>
</header>

<div class="loading" id="loading">Opening the magazine…</div>
<main id="stage" aria-label="Magazine"></main>
<button class="nav" id="prev" aria-label="Previous page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
<button class="nav" id="next" aria-label="Next page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></button>
<div class="hint" id="hint"></div>

<div id="log" role="dialog" aria-modal="true" aria-label="Recent updates">
  <div class="panel">
    <div class="ph"><h2>Recent updates</h2><button class="close" id="closeLog" aria-label="Close">&times;</button></div>
    <p class="lognote">This magazine is still being refined. Here is what has changed recently.</p>
    <div id="logList"></div>
  </div>
</div>
<div id="picker" role="dialog" aria-modal="true" aria-label="Choose a page">
  <div class="panel">
    <div class="ph"><h2>Go to a page</h2><button class="close" id="closePicker" aria-label="Close">&times;</button></div>
    <form class="jump" id="jumpForm"><label for="jumpIn">Page</label><input id="jumpIn" type="number" min="1" max="48" inputmode="numeric" placeholder="1 to 48"><button type="submit">Go</button></form>
    <ul class="chap" id="chap"></ul>
    <div class="grid" id="grid"></div>
  </div>
</div>
<script src="page-flip.js"></script>
<script>
(function(){
  var N = 52, RATIO = 1123 / 794;
  var src = function(i){ return 'pages/p' + (i < 10 ? '0' : '') + i + '.jpg'; };
  var label = function(i){
    if (i === 0) return 'Front cover';
    if (i === 1) return 'Inside front cover';
    if (i === N - 2) return 'Inside back cover';
    if (i === N - 1) return 'Back cover';
    return 'Page ' + (i - 1);
  };
  var stage = document.getElementById('stage'), count = document.getElementById('count');
  var prev = document.getElementById('prev'), next = document.getElementById('next'), hint = document.getElementById('hint');
  var book = null, current = 0, portrait = false;
  var m = /#p(\d+)/.exec(location.hash); if (m) current = Math.min(N - 1, +m[1]);

  function updateUI(i){
    current = i;
    var txt;
    if (portrait) txt = (i + 1) + ' / ' + N;
    else if (i === 0 || i === N - 1) txt = label(i);
    else { var a = i % 2 ? i : i - 1; txt = label(a) + ' · ' + label(a + 1); }
    count.textContent = txt;
    prev.disabled = i === 0; next.disabled = i >= N - 1 || (!portrait && i >= N - 2 && i % 2 === 0 && false);
    try { history.replaceState(null, '', '#p' + i); } catch (e) {}
  }

  function build(){
    var W = window.innerWidth, H = window.innerHeight - 56;
    portrait = !(W >= 900 && W / H >= 1.25);
    document.body.classList.toggle('portrait', portrait);
    var padX = portrait ? 16 : 150, padY = portrait ? 74 : 56;
    var ph = H - padY, pw = ph / RATIO;
    var maxW = portrait ? (W - padX) : (W - padX) / 2;
    if (pw > maxW) { pw = maxW; ph = pw * RATIO; }
    pw = Math.floor(pw); ph = Math.floor(ph);

    if (book) { try { book.destroy(); } catch (e) {} book = null; }
    stage.innerHTML = '';
    var holder = document.createElement('div'); holder.id = 'holder';
    for (var i = 0; i < N; i++) {
      var d = document.createElement('div'); d.className = 'page';
      if (i === 0 || i === N - 1) d.setAttribute('data-density', 'hard');
      var im = document.createElement('img'); im.alt = label(i); im.src = src(i);
      im.loading = Math.abs(i - current) < 4 ? 'eager' : 'lazy'; im.decoding = 'async';
      d.appendChild(im); holder.appendChild(d);
    }
    stage.appendChild(holder);

    book = new St.PageFlip(holder, {
      width: pw, height: ph, size: 'fixed',
      minWidth: pw, maxWidth: pw, minHeight: ph, maxHeight: ph,
      showCover: true, usePortrait: portrait, autoSize: false,
      maxShadowOpacity: 0.45, flippingTime: 800, drawShadow: true,
      mobileScrollSupport: false, swipeDistance: 24, startPage: current,
      showPageCorners: !portrait
    });
    book.loadFromHTML(holder.querySelectorAll('.page'));
    book.on('flip', function(e){ updateUI(e.data); });
    if (portrait) book.updateOrientation && book.updateOrientation('portrait');
    hint.textContent = portrait ? '' : 'Drag a page corner, click a page or use the arrows to turn';
    document.getElementById('loading').style.display = 'none';
    updateUI(book.getCurrentPageIndex());
  }

  // page picker
  var chapters=[[0,'Front cover'],[2,'Contents'],[3,'A Heartfelt Welcome'],[5,'The Making of a Man'],[7,'Where It All Began'],[11,'Honoured'],[15,'The Man. The Vision. The Legacy.'],[21,'Where Our Forever Began'],[25,'To My Loving Husband'],[27,'Our Family'],[31,'Adventures Together'],[33,'Surrounded by Love'],[35,'A Bond We Treasure'],[37,'Words of Love'],[44,'The Best Is Yet to Come'],[48,'Six Days of Celebration'],[51,'Back cover']];
  var picker=document.getElementById('picker'), grid=document.getElementById('grid'), chap=document.getElementById('chap'), built2=false;
  function goTo(i){ closeP(); if(!book) return; i=Math.max(0,Math.min(N-1,i)); book.turnToPage(i); updateUI(book.getCurrentPageIndex()); }
  function buildPicker(){
    if(built2) return; built2=true;
    chapters.forEach(function(c){ var li=document.createElement('li'), b=document.createElement('button'); var n=c[0]>1&&c[0]<N-2?String(c[0]-1).padStart(2,'0'):''; b.innerHTML='<b>'+n+'</b><span>'+c[1]+'</span>'; b.onclick=function(){goTo(c[0]);}; li.appendChild(b); chap.appendChild(li); });
    for(var i=0;i<N;i++){ (function(i){ var b=document.createElement('button'); b.dataset.i=i; var im=document.createElement('img'); im.loading='lazy'; im.alt=''; im.src='thumbs/t'+(i<10?'0':'')+i+'.jpg'; b.appendChild(im); b.appendChild(document.createTextNode(label(i).replace('Page ','').replace('Inside front cover','Inside front').replace('Inside back cover','Inside back'))); b.setAttribute('aria-label','Go to '+label(i)); b.onclick=function(){goTo(i);}; grid.appendChild(b); })(i); }
  }
  function openP(){ buildPicker(); grid.querySelectorAll('button').forEach(function(b){ b.classList.toggle('cur', +b.dataset.i===current); }); picker.classList.add('open'); var c=grid.querySelector('.cur'); var pn=picker.querySelector('.panel'); pn.scrollTop=0; if(c && current>8) c.scrollIntoView({block:'center'}); }
  function closeP(){ picker.classList.remove('open'); }
  document.getElementById('openPicker').onclick=openP;
  document.getElementById('closePicker').onclick=closeP;
  picker.addEventListener('click',function(e){ if(e.target===picker) closeP(); });
  document.addEventListener('keydown',function(e){ if(e.key==='Escape') closeP(); });
  document.getElementById('jumpForm').onsubmit=function(e){ e.preventDefault(); var v=parseInt(document.getElementById('jumpIn').value,10); if(!isNaN(v)) goTo(v+1); };
  count.style.cursor='pointer'; count.title='Choose a page'; count.onclick=openP;

  // modifications log: [date, [[text, pageIndexOrNull], ...]]
  var LOG=[
    ['13 November 2026',[
      ['The Pani family page now features the Christmas family portrait',30],
      ['Page 48 has a new background, and the page number was removed',49],
      ['Back cover refined',51],
      ['Front cover refreshed with the final artwork',0],
      ['New Pages button to jump to any page or chapter',null]
    ]],
    ['12 November 2026',[
      ['Metallic gold finish on the cover titles',0],
      ['Updates to the Limen family, Thank You and closing pages',36],
      ['Light background and page-turn effect for easier reading',null],
      ['First full draft shared',null]
    ]]
  ];
  var LOGV=LOG[0][0];
  var logEl=document.getElementById('log');
  (function(){ var L=document.getElementById('logList'); LOG.forEach(function(d){ var w=document.createElement('div'); w.className='logday'; var h=document.createElement('h3'); h.textContent=d[0]; w.appendChild(h); var ul=document.createElement('ul'); d[1].forEach(function(it){ var li=document.createElement('li'); li.appendChild(document.createTextNode(it[0])); if(it[1]!==null){ li.appendChild(document.createTextNode(' ')); var b=document.createElement('button'); b.textContent='View'; b.onclick=function(){ logEl.classList.remove('open'); goTo(it[1]); }; li.appendChild(b);} ul.appendChild(li); }); w.appendChild(ul); L.appendChild(w); }); })();
  try{ if(localStorage.getItem('jerry50log')!==LOGV) document.getElementById('logDot').classList.add('on'); }catch(e){}
  document.getElementById('openLog').onclick=function(){ logEl.classList.add('open'); logEl.querySelector('.panel').scrollTop=0; document.getElementById('logDot').classList.remove('on'); try{localStorage.setItem('jerry50log',LOGV);}catch(e){} };
  document.getElementById('closeLog').onclick=function(){ logEl.classList.remove('open'); };
  logEl.addEventListener('click',function(e){ if(e.target===logEl) logEl.classList.remove('open'); });
  document.addEventListener('keydown',function(e){ if(e.key==='Escape') logEl.classList.remove('open'); });

  prev.onclick = function(){ book && book.flipPrev(); };
  next.onclick = function(){ book && book.flipNext(); };
  document.addEventListener('keydown', function(e){
    if (!book || picker.classList.contains('open') || document.getElementById('log').classList.contains('open')) return;
    if (e.key === 'ArrowRight' || e.key === 'PageDown') { e.preventDefault(); book.flipNext(); }
    if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); book.flipPrev(); }
  });
  var t, lastMode = null, lastW = 0, lastH = 0;
  window.addEventListener('resize', function(){
    clearTimeout(t);
    t = setTimeout(function(){
      if (Math.abs(window.innerWidth - lastW) < 40 && Math.abs(window.innerHeight - lastH) < 120) return;
      lastW = window.innerWidth; lastH = window.innerHeight; build();
    }, 250);
  });
  lastW = window.innerWidth; lastH = window.innerHeight;
  build();
})();
</script>
</body>
</html>
