<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jerry at 50 · Commemorative Magazine</title>
<meta name="description" content="Jerry Pani: 50th Birthday Celebration & 20th Wedding Anniversary. Cape Town, November 2026.">
<meta property="og:title" content="Jerry at 50 · Commemorative Magazine">
<meta property="og:description" content="50th Birthday Celebration & 20th Wedding Anniversary. Cape Town, November 2026.">
<meta property="og:image" content="pages/p00.jpg">
<meta name="theme-color" content="#ffffff">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&display=swap">
<style>
:root{--bg:#e7e4de;--bar-bg:#ffffff;--ink:#1d1a16;--gold:#b8933a;--gold-btn:#d9b65e;--muted:#7a7266;--bar:56px}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:'Cormorant Garamond',Georgia,serif;overflow:hidden}
header{position:fixed;inset:0 0 auto 0;height:var(--bar);display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 20px;background:var(--bar-bg);box-shadow:0 1px 0 rgba(0,0,0,.06);z-index:5}
.brand{font-weight:600;font-size:21px;color:var(--ink);white-space:nowrap}
.brand span{color:var(--gold);font-style:italic;font-weight:500;margin-left:6px}
.right{display:flex;align-items:center;gap:14px}
.count{font-size:17px;color:var(--muted);font-variant-numeric:lining-nums tabular-nums;white-space:nowrap}
.dl{display:inline-flex;align-items:center;gap:6px;color:#1d1a16;background:var(--gold-btn);text-decoration:none;font-weight:600;font-size:16px;padding:8px 14px;border-radius:999px;min-height:40px}
.dl:hover{background:#e7c97a}
.dl svg{width:16px;height:16px}

#stage{position:fixed;inset:var(--bar) 0 0 0;display:flex;align-items:center;justify-content:center}
#holder{position:relative}
.page{background:#fff}
.page img{width:100%;height:100%;display:block;object-fit:cover;user-select:none;-webkit-user-drag:none}
/* thin edge so every page boundary reads clearly, even dark pages */
.page::after{content:"";position:absolute;inset:0;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08);pointer-events:none}
.stf__parent{filter:drop-shadow(0 14px 28px rgba(40,30,15,.22)) drop-shadow(0 2px 4px rgba(40,30,15,.12))}

.nav{position:fixed;top:50%;transform:translateY(-50%);width:50px;height:50px;border-radius:50%;border:none;background:#fff;color:var(--ink);display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:4;box-shadow:0 4px 14px rgba(0,0,0,.12)}
.nav:hover{color:var(--gold)}
.nav:disabled{opacity:.35;cursor:default}
.nav svg{width:22px;height:22px}
#prev{left:16px}#next{right:16px}
.hint{position:fixed;bottom:8px;left:0;right:0;text-align:center;font-size:15px;color:var(--muted);font-style:italic;pointer-events:none}
.loading{position:fixed;inset:var(--bar) 0 0 0;display:flex;align-items:center;justify-content:center;font-size:20px;font-style:italic;color:var(--muted)}
.portrait .nav{width:40px;height:40px;top:auto;bottom:14px;transform:none;opacity:.92}
.portrait #prev{left:14px}.portrait #next{right:14px}
@media (max-width:560px){.brand span{display:none}.dl .t{display:none}.dl{padding:8px 11px}header{padding:0 12px}}
</style>
</head>
<body>
<header>
  <div class="brand">Jerry at 50<span>· 50 years of life, 20 years of love</span></div>
  <div class="right">
    <div class="count" id="count" aria-live="polite"></div>
    <a class="dl" href="Jerry_at_50_Magazine.pdf" download aria-label="Download the magazine as a PDF"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12m0 0-5-5m5 5 5-5M4 21h16"/></svg><span class="t">Download PDF</span></a>
  </div>
</header>

<div class="loading" id="loading">Opening the magazine…</div>
<main id="stage" aria-label="Magazine"></main>
<button class="nav" id="prev" aria-label="Previous page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
<button class="nav" id="next" aria-label="Next page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></button>
<div class="hint" id="hint"></div>

<script src="page-flip.js"></script>
<script>
(function(){
  var N = 52, RATIO = 1123 / 794;
  var src = function(i){ return 'pages/p' + (i < 10 ? '0' : '') + i + '.jpg'; };
  var label = function(i){
    if (i === 0) return 'Front cover';
    if (i === 1) return 'Inside front cover';
    if (i === N - 2) return 'Inside back cover';
    if (i === N - 1) return 'Back cover';
    return 'Page ' + (i - 1);
  };
  var stage = document.getElementById('stage'), count = document.getElementById('count');
  var prev = document.getElementById('prev'), next = document.getElementById('next'), hint = document.getElementById('hint');
  var book = null, current = 0, portrait = false;
  var m = /#p(\d+)/.exec(location.hash); if (m) current = Math.min(N - 1, +m[1]);

  function updateUI(i){
    current = i;
    var txt;
    if (portrait) txt = (i + 1) + ' / ' + N;
    else if (i === 0 || i === N - 1) txt = label(i);
    else { var a = i % 2 ? i : i - 1; txt = label(a) + ' · ' + label(a + 1); }
    count.textContent = txt;
    prev.disabled = i === 0; next.disabled = i >= N - 1 || (!portrait && i >= N - 2 && i % 2 === 0 && false);
    try { history.replaceState(null, '', '#p' + i); } catch (e) {}
  }

  function build(){
    var W = window.innerWidth, H = window.innerHeight - 56;
    portrait = !(W >= 900 && W / H >= 1.25);
    document.body.classList.toggle('portrait', portrait);
    var padX = portrait ? 16 : 150, padY = portrait ? 74 : 56;
    var ph = H - padY, pw = ph / RATIO;
    var maxW = portrait ? (W - padX) : (W - padX) / 2;
    if (pw > maxW) { pw = maxW; ph = pw * RATIO; }
    pw = Math.floor(pw); ph = Math.floor(ph);

    if (book) { try { book.destroy(); } catch (e) {} book = null; }
    stage.innerHTML = '';
    var holder = document.createElement('div'); holder.id = 'holder';
    for (var i = 0; i < N; i++) {
      var d = document.createElement('div'); d.className = 'page';
      if (i === 0 || i === N - 1) d.setAttribute('data-density', 'hard');
      var im = document.createElement('img'); im.alt = label(i); im.src = src(i);
      im.loading = Math.abs(i - current) < 4 ? 'eager' : 'lazy'; im.decoding = 'async';
      d.appendChild(im); holder.appendChild(d);
    }
    stage.appendChild(holder);

    book = new St.PageFlip(holder, {
      width: pw, height: ph, size: 'fixed',
      minWidth: pw, maxWidth: pw, minHeight: ph, maxHeight: ph,
      showCover: true, usePortrait: portrait, autoSize: false,
      maxShadowOpacity: 0.45, flippingTime: 800, drawShadow: true,
      mobileScrollSupport: false, swipeDistance: 24, startPage: current,
      showPageCorners: !portrait
    });
    book.loadFromHTML(holder.querySelectorAll('.page'));
    book.on('flip', function(e){ updateUI(e.data); });
    if (portrait) book.updateOrientation && book.updateOrientation('portrait');
    hint.textContent = portrait ? '' : 'Drag a page corner, click a page or use the arrows to turn';
    document.getElementById('loading').style.display = 'none';
    updateUI(book.getCurrentPageIndex());
  }

  prev.onclick = function(){ book && book.flipPrev(); };
  next.onclick = function(){ book && book.flipNext(); };
  document.addEventListener('keydown', function(e){
    if (!book) return;
    if (e.key === 'ArrowRight' || e.key === 'PageDown') { e.preventDefault(); book.flipNext(); }
    if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); book.flipPrev(); }
  });
  var t, lastMode = null, lastW = 0, lastH = 0;
  window.addEventListener('resize', function(){
    clearTimeout(t);
    t = setTimeout(function(){
      if (Math.abs(window.innerWidth - lastW) < 40 && Math.abs(window.innerHeight - lastH) < 120) return;
      lastW = window.innerWidth; lastH = window.innerHeight; build();
    }, 250);
  });
  lastW = window.innerWidth; lastH = window.innerHeight;
  build();
})();
</script>
</body>
</html>
